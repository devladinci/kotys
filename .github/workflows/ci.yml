name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format (prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint guard (layering zones)
        run: pnpm lint:guard

      - name: Knip
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

  # turbo's ^build dependency builds contracts/core before the filtered test runs.
  test:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@kotys/contracts"
          - "@kotys/db"
          - "@kotys/core"
          - "@kotys/api"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test ${{ matrix.package }}
        run: pnpm exec turbo run test --filter=${{ matrix.package }} --only --output-logs=errors-only

  build:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Only the api suite runs here; the rest is platform-independent (covered on ubuntu).
  macos:
    runs-on: macos-latest
    needs: static
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test api
        run: pnpm exec turbo run test --filter=@kotys/api --only --output-logs=errors-only
