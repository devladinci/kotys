packages:
  - "packages/*"
  - "apps/*"
# One React across the monorepo: Metro bundles @kotys/core source into the
# mobile app, so a second copy (even a patch-version apart) breaks hooks.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
allowBuilds:
  better-sqlite3: true
  electron-winstaller: false
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.19"
  - "@expo/inline-modules@0.1.7"
  - "@expo/local-build-cache-provider@57.0.8"
  - "@expo/log-box@57.0.4"
  - "@expo/metro-config@57.0.11"
  - "@expo/metro-runtime@57.0.14"
  - "@expo/prebuild-config@57.0.15"
  - "@expo/router-server@57.0.8"
  - "@expo/ui@57.0.14"
  - babel-preset-expo@57.0.9
  - expo-asset@57.0.15
  - expo-constants@57.0.15
  - expo-file-system@57.0.6
  - expo-linking@57.0.8
  - expo-modules-autolinking@57.0.12
  - expo-modules-core@57.0.14
  - expo-modules-jsi@57.0.6
  - expo-notifications@57.0.15
  - expo-router@57.0.17
  - expo-secure-store@57.0.2
  - expo@57.0.17
